name: Update data and deploy

on:
  schedule:
    # Weekdays, UTC. Most federal releases land at 8:30 a.m. ET and reach FRED
    # within the hour; the second run catches afternoon and late updates.
    - cron: "47 13 * * 1-5"
    - cron: "13 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "pipeline/**", "site/**", ".github/workflows/**"]

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Build dashboard data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pipeline.build

      - name: AI section summaries (skipped if no key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.ai_notes

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/dashboard.json data_cache/ncua_summary.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
